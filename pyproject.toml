[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoledger-homeassistant"
version = "1.0.0"
description = "AutoLedger Home Assistant Custom Component Integration"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Rem7474" }
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
pythonpath = [".", "custom_components"]
markers = [
    "asyncio: mark test as asynchronous",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["custom_components/autoledger"]
omit = ["tests/*"]

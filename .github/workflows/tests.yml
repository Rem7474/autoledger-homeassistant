name: Tests & Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov aiohttp

      - name: Run test suite with pytest
        run: |
          pytest --cov=custom_components.autoledger --cov-report=term-missing

  pytest-homeassistant:
    name: Pytest (real Home Assistant core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --only-binary :all: --no-binary lru-dict,mock-open,pyric --require-hashes --no-deps -r tests_ha/requirements.txt

      - name: Run the tests against Home Assistant
        run: |
          pytest tests_ha

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package HACS Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build HACS zip archive
        run: |
          cd "${{ github.workspace }}/custom_components/autoledger"
          zip -r "${{ github.workspace }}/autoledger.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: autoledger.zip
          generate_release_notes: true
